<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1><i class="fas fa-cloud-sun"></i> Weather Dashboard</h1>
            <p class="subtitle">Real-time Weather Information</p>
        </header>

        <!-- Search Section -->
        <div class="search-section">
            <div class="search-box">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Enter city name..."
                    class="search-input"
                >
                <button id="searchBtn" class="search-btn">
                    <i class="fas fa-search"></i> Search
                </button>
            </div>
            <button id="locationBtn" class="location-btn" title="Use current location">
                <i class="fas fa-location-dot"></i> Current Location
            </button>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="error-message"></div>

        <!-- Loading Spinner -->
        <div id="loadingSpinner" class="loading-spinner hidden">
            <div class="spinner"></div>
            <p>Loading weather data...</p>
        </div>

        <!-- Main Weather Display -->
        <div id="weatherContainer" class="weather-container hidden">
            <!-- Current Weather -->
            <div class="current-weather">
                <div class="location-info">
                    <h2 id="cityName"></h2>
                    <p id="currentDate"></p>
                </div>
                <div class="weather-main">
                    <div class="temperature-display">
                        <img id="weatherIcon" src="" alt="Weather icon" class="weather-icon-large">
                        <div class="temp-info">
                            <span id="temperature" class="temperature"></span>
                            <span class="temp-unit">°C</span>
                        </div>
                    </div>
                    <div class="weather-description">
                        <p id="description" class="description"></p>
                        <p id="feelsLike" class="feels-like"></p>
                    </div>
                </div>
            </div>

            <!-- Weather Details Grid -->
            <div class="weather-details">
                <div class="detail-card">
                    <div class="detail-icon">
                        <i class="fas fa-droplet"></i>
                    </div>
                    <div class="detail-content">
                        <p class="detail-label">Humidity</p>
                        <p id="humidity" class="detail-value"></p>
                    </div>
                </div>

                <div class="detail-card">
                    <div class="detail-icon">
                        <i class="fas fa-wind"></i>
                    </div>
                    <div class="detail-content">
                        <p class="detail-label">Wind Speed</p>
                        <p id="windSpeed" class="detail-value"></p>
                    </div>
                </div>

                <div class="detail-card">
                    <div class="detail-icon">
                        <i class="fas fa-gauge"></i>
                    </div>
                    <div class="detail-content">
                        <p class="detail-label">Pressure</p>
                        <p id="pressure" class="detail-value"></p>
                    </div>
                </div>

                <div class="detail-card">
                    <div class="detail-icon">
                        <i class="fas fa-eye"></i>
                    </div>
                    <div class="detail-content">
                        <p class="detail-label">Visibility</p>
                        <p id="visibility" class="detail-value"></p>
                    </div>
                </div>

                <div class="detail-card">
                    <div class="detail-icon">
                        <i class="fas fa-cloud-rain"></i>
                    </div>
                    <div class="detail-content">
                        <p class="detail-label">Precipitation</p>
                        <p id="precipitation" class="detail-value"></p>
                    </div>
                </div>

                <div class="detail-card">
                    <div class="detail-icon">
                        <i class="fas fa-sun"></i>
                    </div>
                    <div class="detail-content">
                        <p class="detail-label">UV Index</p>
                        <p id="uvIndex" class="detail-value"></p>
                    </div>
                </div>
            </div>

            <!-- 5-Day Forecast -->
            <div class="forecast-section">
                <h3><i class="fas fa-calendar"></i> 5-Day Forecast</h3>
                <div id="forecastContainer" class="forecast-container"></div>
            </div>
        </div>

        <!-- Welcome Message (when no data loaded) -->
        <div id="welcomeMessage" class="welcome-message">
            <div class="welcome-content">
                <i class="fas fa-cloud-sun-rain"></i>
                <h2>Welcome to Weather Dashboard</h2>
                <p>Search for a city or use your current location to get started!</p>
                <div class="welcome-examples">
                    <p>Try searching: <span>London</span>, <span>New York</span>, <span>Tokyo</span></p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
